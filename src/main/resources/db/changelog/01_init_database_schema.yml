databaseChangeLog:
  - changeSet:
      id: 01_init_database_schema
      author: Mrr.rothabetta31@gmail.com
      changes:
        - createTable:
            tableName: brands
            columns:
              - column:
                  name: brand_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: brand_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - createTable:
            tableName: models
            columns:
              - column:
                  name: model_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: model_name
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: brand_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: models
            baseColumnNames: brand_id
            constraintName: fk_models_brands
            referencedTableName: brands
            referencedColumnNames: brand_id
